<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fake Meet Harness</title>
    <style>
      /*
        Layout deliberately mimics the shape the region-detection heuristic
        (extension/content/adapters/dominantRegion.ts) looks for: one large
        "presentation" video dwarfing a strip of small "camera" tiles. This
        is what lets the E2E suite exercise the real adapter code path
        instead of a mocked one.
      */
      body {
        margin: 0;
        background: #202124;
        display: flex;
        height: 100vh;
        font-family: sans-serif;
      }
      #presentation {
        flex: 1;
        /*
          A <video> is a replaced element: flexbox gives it an automatic
          minimum size equal to its own intrinsic content size (1280px once
          the stream attaches) unless told otherwise. Without this, that
          intrinsic size wins over `flex: 1`'s shrink behavior and starves
          #cam-strip of the space it needs, down to 0 -- exactly the bug
          this comment is here to stop someone from reintroducing.
        */
        min-width: 0;
        display: block;
        background: black;
      }
      #cam-strip {
        width: 160px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 4px;
      }
      #cam-strip video {
        width: 100%;
        height: 90px;
        background: #333;
        border-radius: 4px;
      }
      #controls {
        position: fixed;
        bottom: 8px;
        left: 8px;
        color: #fff;
        font-size: 12px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <!-- id/data-testid selectors are for the harness's own script and
         Playwright assertions; the adapter under test never reads them --
         it only reasons about rendered video geometry, which is what makes
         this harness a meaningful stand-in for the real Meet DOM rather
         than a shortcut around it. -->
    <video id="presentation" data-testid="presentation" autoplay muted playsinline></video>
    <div id="cam-strip">
      <video data-testid="cam-1" autoplay muted playsinline></video>
      <video data-testid="cam-2" autoplay muted playsinline></video>
    </div>
    <div id="controls">
      <span id="status">loading…</span>
    </div>
    <script type="module" src="./harness.js"></script>
  </body>
</html>
